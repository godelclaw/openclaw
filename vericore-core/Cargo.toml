[package]
name = "vericore-core"
version = "0.2.0"
edition = "2024"

[dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
adclaw-memory = { path = "../adclaw-memory" }
vericore-policy = { path = "../vericore-policy" }
